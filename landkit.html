<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landkit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        header {
            font-size: 24px;
            font-family: segoe UI;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            padding: 20px;
            margin-top: 20px;
        }
        .title {
            font-weight: bold;
            color: blue;
            font-size: 28px;
        }
        nav span {
            margin-left: 20px;
            margin-right: 20px;
        }
        .btn-buy {
            background-color: blue;
            color: white;
            padding: 10px;
            border-radius: 10px;
        }
        .banner {
            width: 50%;
            float: right;
        }
        main {
            margin-top: 100px;
        }
        .main-title {
            font-size: 50px;
            font-family: Arial;
            padding-left: 100px;
            margin-bottom: 50px;
        }
        .sub-title {
            font-size: 25px;
            font-family: Arial;
            padding-left: 100px;
            color: gray;
            margin-bottom: 40px;
        }
        .button-container {
            padding-left: 100px;
        }
        button {
            width: 200px;
            height: 50px;
            font-family: Arial;
            font-size: 20px;
        }
        .btn-pages {
            background-color: blue;
            color: white;
            border: none;
        }
        .btn-docs {
            background-color: rgb(214, 214, 252);
            border: none;
            margin-left: 10px;
        }
    </style>    
</head>


<body>
    <header>
        <div>
            <span class="title">Landkit.</span>
         
        </div>
        <div>
            <nav>
                <span>Landings</span>
                <span>Pages</span>
                <span>Account</span>
                <span>Documentation</span>
            </nav>
        </div>
        <div>
            <span class="btn-buy">Buy now</span>
        </div>
    </header>
    <section>
        <main>
            <img src="./public/images/landkit-banner.png" class="banner">
            <div>
                <div class="main-title">Welcome to <span style="color: blue;">Landkit</span>. Develop anything.</div>
                <div class="sub-title">Build a beautiful, modern website with flexible Bootstrap components built from scratch.</div>
                <div class="button-container">
                    <button class="btn-pages">View Pages<span class="bi bi-arrow-right"></span></button>
                    <button class="btn-docs">Documentation</button>
                </div>
            </div>
        </main>
    </section>
</body>
</html>
